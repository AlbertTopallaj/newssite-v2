<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Login For Admin | Devnews Java</title>
  </head>

  <body class="flex flex-col min-h-screen">
    <ul
      class="flex flex-row justify-end gap-5 text-center fixed h-16 shadow-2xl top-0 right-0 left-0 p-5 bg-white z-50"
    >
      <li class="mr-auto cursor-pointer text-xl font-bold">
        <a href="index.html">Java Dev News</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="#latest-news">Latest News</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="#java">Java</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="#springboot">Spring Boot</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="login.html">Login</a>
      </li>
    </ul>

    <form
      onsubmit="handleLogin(event)"
      class="flex flex-col gap-2 w-full max-w-md mx-auto mt-auto p-10 bg-white rounded-xl shadow-sm border border-gray-200"
    >
      <h2 class="text-xl font-bold text-gray-800 mb-2">Admin Login</h2>
      <span class="text-sm font-medium text-gray-600 mt-2">Username</span>
      <input
        id="username"
        type="text"
        class="px-4 py-3 rounded-lg bg-gray-50 text-gray-800 border border-gray-300 focus:outline-none focus:border-gray-500 transition"
        placeholder="Enter your username"
      />
      <span class="text-sm font-medium text-gray-600 mt-2">Password</span>
      <input
        id="password"
        type="password"
        class="px-4 py-3 rounded-lg bg-gray-50 text-gray-800 border border-gray-300 focus:outline-none focus:border-gray-500 transition"
        placeholder="Enter your password"
      />

      <p id="error" class="text-red-500 text-sm hidden">
        Error: Wrong User Credentials, try again
      </p>

      <button
        class="mt-4 py-3 bg-gray-800 hover:bg-gray-900 text-white font-semibold rounded-lg transition cursor-pointer"
      >
        Login
      </button>
    </form>

    <footer class="mt-auto w-full flex flex-col p-6 md:p-10 border-t">
      <div class="flex flex-col md:flex-row justify-around items-start gap-8">
        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">Socials</h1>
          <div class="flex flex-row gap-4">
            <a href="https://github.com/" class="hover:opacity-70 transition">
              <i class="fab fa-github fa-2xl"></i>
            </a>
            <a
              href="https://www.facebook.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-facebook fa-2xl"></i>
            </a>
            <a
              href="https://www.instagram.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-instagram fa-2xl"></i>
            </a>
            <a
              href="https://www.tiktok.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-tiktok fa-2xl"></i>
            </a>
            <a
              href="https://www.linkedin.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-linkedin fa-2xl"></i>
            </a>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">Contact us</h1>
          <a
            href="https://mail.google.com/"
            class="flex items-center gap-2 hover:opacity-70 transition"
          >
            <i class="fas fa-envelope fa-2xl"></i>
            <span>javanews@dev.com</span>
          </a>
        </div>

        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">About Us</h1>
          <p class="tracking-wide">The Best News Site for Java Developers.</p>
        </div>
      </div>

      <p class="text-sm text-gray-400 text-center mt-8">
        © <span id="year"></span> JavaNews
      </p>
    </footer>
    <script src="/src/login.js"></script>
  </body>
</html>
