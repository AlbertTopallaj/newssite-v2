<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Create Article | Java Devnews</title>
  </head>

  <body>
    <a href="admin.html" class="text-sm text-gray-400 hover:text-gray-600 mb-8 inline-block">← Back</a>
    <form class="flex flex-col gap-2 max-w-md mx-auto mt-10">
      <label class="text-sm font-medium text-gray-700">Title</label>
      <input
        id="title"
        placeholder="Enter a title for the article..."
        type="text"
        class="px-4 py-2 border border-gray-300 rounded-lg text-base focus:outline-none focus:border-blue-500"
      />

      <label class="text-sm font-medium text-gray-700">Category</label>
      <select
        id="category"
        class="px-4 py-2 border border-gray-300 rounded-lg text-base focus:outline-none focus:border-blue-500"
      >
        <option value="">No Category</option>
        <option value="java">Java</option>
        <option value="springboot">Spring Boot</option>
      </select>

      <div class="flex items-center gap-2">
      <label class="text-sm font-medium text-gray-700"
        >Is this a latest news?</label
      >
      <input
        type="checkbox"
        class="w-4 h-4 cursor-pointer px-4 py-2 border border-gray-300 rounded-lg text-base focus:outline-none focus:border-blue-500"
        id="latestnews-checkbox"
      />
      </div>

      <label class="text-sm font-medium text-gray-700">Content</label>
      <textarea
        id="content"
        placeholder="Enter the content for the article..."
        class="px-4 py-2 border border-gray-300 rounded-lg text-base focus:outline-none focus:border-blue-500 resize-none h-40"
      ></textarea>

      <button
        type="submit"
        class="mt-2 py-2 bg-blue-500 hover:bg-blue-600 text-white font-medium rounded-lg cursor-pointer"
      >
        Create
      </button>
    </form>

    <footer class="mt-10 w-full flex flex-col p-6 md:p-10 border-t">
      <div class="flex flex-col md:flex-row justify-around items-start gap-8">
        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">Socials</h1>
          <div class="flex flex-row gap-4">
            <a href="https://github.com/" class="hover:opacity-70 transition">
              <i class="fab fa-github fa-2xl"></i>
            </a>
            <a
              href="https://www.facebook.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-facebook fa-2xl"></i>
            </a>
            <a
              href="https://www.instagram.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-instagram fa-2xl"></i>
            </a>
            <a
              href="https://www.tiktok.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-tiktok fa-2xl"></i>
            </a>
            <a
              href="https://www.linkedin.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-linkedin fa-2xl"></i>
            </a>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">Contact us</h1>
          <a
            href="https://mail.google.com/"
            class="flex items-center gap-2 hover:opacity-70 transition"
          >
            <i class="fas fa-envelope fa-2xl"></i>
            <span>javanews@dev.com</span>
          </a>
        </div>

        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">About Us</h1>
          <p class="tracking-wide">The Best News Site for Java Developers.</p>
        </div>
      </div>

      <p class="text-sm text-gray-400 text-center mt-8">
        © <span id="year"></span> JavaNews
      </p>
    </footer>

    <div
      id="toast-container"
      class="fixed bottom-6 right-5 flex flex-col gap-2"
    ></div>
  </body>
  <script src="src/toasts.js"></script>
  <script src="/src/tags.js"></script>
  <script src="src/create-article.js"></script>
</html>
