<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
     <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>Admin Dashboard | Java Devnews</title>
  </head>

  <body>
    <ul
      class="flex flex-row justify-end gap-5 text-center h-16 shadow-2xl top-0 right-0 left-0 p-5 bg-white z-50"
    >
      <li class="mr-auto cursor-pointer text-xl font-bold">
        <a href="index.html">Java Dev News</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="#latest-news">Latest News</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="#java">Java</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="#springboot">Spring Boot</a>
      </li>
      <li class="cursor-pointer text-l md:text-xl hover:text-gray-500">
        <a href="login.html">Login</a>
      </li>
    </ul>

    <h2 class="text-4xl text-wrap text-center mt-5">Admin Dashboard</h2>
    <a
      class="inline-flex items-center gap-2 px-6 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colrs duration-150 ml-5"
      href="createarticle.html"
      >Create Article</a
    >

    <article class="flex flex-col gap-4" id="articles"></article>

    <div
      id="toast-container"
      class="fixed bottom-6 right-5 flex flex-col gap-2"
    ></div>

    <footer class="mt-10 w-full flex flex-col p-6 md:p-10 border-t">
      <div class="flex flex-col md:flex-row justify-around items-start gap-8">
        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">Socials</h1>
          <div class="flex flex-row gap-4">
            <a href="https://github.com/" class="hover:opacity-70 transition">
              <i class="fab fa-github fa-2xl"></i>
            </a>
            <a
              href="https://www.facebook.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-facebook fa-2xl"></i>
            </a>
            <a
              href="https://www.instagram.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-instagram fa-2xl"></i>
            </a>
            <a
              href="https://www.tiktok.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-tiktok fa-2xl"></i>
            </a>
            <a
              href="https://www.linkedin.com/"
              class="hover:opacity-70 transition"
            >
              <i class="fab fa-linkedin fa-2xl"></i>
            </a>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">Contact us</h1>
          <a
            href="https://mail.google.com/"
            class="flex items-center gap-2 hover:opacity-70 transition"
          >
            <i class="fas fa-envelope fa-2xl"></i>
            <span>javanews@dev.com</span>
          </a>
        </div>

        <div class="flex flex-col gap-4">
          <h1 class="font-bold text-lg">About Us</h1>
          <p class="tracking-wide">The Best News Site for Java Developers.</p>
        </div>
      </div>

      <p class="text-sm text-gray-400 text-center mt-8">
        © <span id="year"></span> JavaNews
      </p>
    </footer>

    <script src="/src/toasts.js"></script>
    <script src="/src/create-article.js"></script>
    <script src="/src/auth.js"></script>
    <script src="/src/tags.js"></script>
    <script src="/src/admin.js"></script>
    <script src="/src/script.js"></script>
    <script src="/src/display-article.js"></script>
  </body>
</html>
